name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Engine unit tests
        run: gradle --no-daemon --stacktrace :engine:test

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Summary
        run: |
          ls -l app/build/outputs/apk/debug/
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          ls -l app/build/outputs/apk/debug/*.apk | awk '{print "- " $9 " (" $5 " bytes)"}' >> "$GITHUB_STEP_SUMMARY"

      # The account's artifact storage may be full; a failed upload must not fail the build.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dokey-android-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: engine-test-report
          path: engine/build/reports/tests/
          retention-days: 3

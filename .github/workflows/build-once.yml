name: Build (temporary)

# One-off build to compile and test the next version. Removed again once it passes.
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also attach the APK to a draft release"
        type: boolean
        default: false
      tag:
        description: "Release tag"
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build
        run: gradle --no-daemon :engine:test :app:assembleDebug

      - name: Test report
        if: failure()
        run: find engine/build/test-results -name '*.xml' -exec grep -l '<failure' {} \; | xargs -r cat | grep -A8 '<failure' | head -80

      - name: Draft release
        if: ${{ inputs.draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "dokey-android-$TAG-debug.apk"
          gh release create "$TAG" "dokey-android-$TAG-debug.apk" --draft --target "$GITHUB_SHA" \
            --title "Dokey Android $TAG" --notes "Bản nháp."

name: Build (temporary)

# One-off build to compile and test version 0.2. Removed again once it passes.
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also attach the APK to a draft release v0.2.0"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build
        run: gradle --no-daemon :engine:test :app:assembleDebug

      - name: Draft release
        if: ${{ inputs.draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dokey-android-v0.2.0-debug.apk
          gh release create v0.2.0 dokey-android-v0.2.0-debug.apk --draft --target "$GITHUB_SHA" \
            --title "Dokey Android v0.2.0" --notes "Bản nháp."
